 </defs><rect x="0" y="0" width="980" height="420" rx="24" fill="url(#back)"/><rect x="18" y="18" width="944" height="384" rx="20" fill="white" opacity=".7"/><text x="490" y="64" fill="#1c594e" font-family="Arial,Helvetica,sans-serif" font-size="37" font-weight="700" text-anchor="middle">2 Mg + O₂ → 2 MgO</text><rect x="42" y="98" width="414" height="258" rx="22" fill="#f6fbf8" stroke="#d5e9e3" stroke-width="2" filter="url(#shade)"/><rect x="530" y="98" width="409" height="258" rx="22" fill="#f6fbf8" stroke="#d5e9e3" stroke-width="2" filter="url(#shade)"/><text x="248" y="133" fill="#193b34" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle">REACTANTS</text><text x="734" y="133" fill="#193b34" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle">PRODUCTS</text><circle cx="140" cy="220" r="37" fill="url(#gold)" stroke="#fff" stroke-width="2"/><text x="140" y="228" fill="#624719" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="middle">Mg</text><circle cx="240" cy="220" r="37" fill="url(#gold)" stroke="#fff" stroke-width="2"/><text x="240" y="228" fill="#624719" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="middle">Mg</text><circle cx="337" cy="219" r="31" fill="url(#red)" stroke="#fff" stroke-width="2"/><circle cx="378" cy="219" r="31" fill="url(#red)" stroke="#fff" stroke-width="2"/><text x="358" y="225" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle">O₂</text><path d="M460 235 L519 235" stroke="#199f8e" stroke-width="5" stroke-linecap="round" marker-end="url(#arr)" fill="none"/><circle cx="633" cy="225" r="36" fill="url(#gold)" stroke="#fff" stroke-width="2"/><text x="633" y="230" fill="#624719" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="middle">Mg</text><circle cx="675" cy="225" r="31" fill="url(#red)" stroke="#fff" stroke-width="2"/><text x="675" y="230" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="middle">O</text><circle cx="786" cy="225" r="36" fill="url(#gold)" stroke="#fff" stroke-width="2"/><text x="786" y="230" fill="#624719" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="middle">Mg</text><circle cx="828" cy="225" r="31" fill="url(#red)" stroke="#fff" stroke-width="2"/><text x="828" y="230" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="middle">O</text><text x="244" y="328" fill="#56786e" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle">2 Mg atoms  +  2 O atoms</text><text x="734" y="328" fill="#56786e" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle">2 Mg atoms  +  2 O atoms</text><text x="490" y="391" fill="#17695c" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="middle">Change COEFFICIENTS — never change the formula subscripts.</text></svg>