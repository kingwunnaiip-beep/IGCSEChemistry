<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-label="The balanced equation 2Mg plus O2 yields 2MgO has two Mg atoms and two O atoms on both sides."><defs>
