<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-label="Ionic lattice">
    <rect width="1000" height="360" rx="22" fill="#fbfdfc"/>
    <text x="500.0" y="36" text-anchor="middle" font-size="28" font-weight="700" font-family="Arial,sans-serif" fill="#143d35">Ionic lattice</text>
    <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a7b65"/>
    </marker>
    </defs><rect x="80" y="92" width="370" height="210" rx="18" fill="#eef4ff" stroke="#bfd1ee" stroke-width="2"/><rect x="560" y="92" width="300" height="210" rx="18" fill="#eefaf1" stroke="#c3dec9" stroke-width="2"/><circle cx="170" cy="160" r="35" fill="#c8e2ff" stroke="#6b8897" stroke-width="2"/><text x="170" y="168" text-anchor="middle" font-size="28" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">K⁺</text><circle cx="270" cy="160" r="35" fill="#ffe3b5" stroke="#6b8897" stroke-width="2"/><text x="270" y="168" text-anchor="middle" font-size="28" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">Br⁻</text><circle cx="170" cy="240" r="35" fill="#ffe3b5" stroke="#6b8897" stroke-width="2"/><text x="170" y="248" text-anchor="middle" font-size="28" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">Br⁻</text><circle cx="270" cy="240" r="35" fill="#c8e2ff" stroke="#6b8897" stroke-width="2"/><text x="270" y="248" text-anchor="middle" font-size="28" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">K⁺</text><text x="710" y="135" text-anchor="middle" font-size="24" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">Potassium bromide</text><text x="710" y="180" text-anchor="middle" font-size="26" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">giant ionic lattice</text><text x="710" y="225" text-anchor="middle" font-size="22" font-weight="400" font-family="Arial,sans-serif" fill="#244a40">strong electrostatic attraction</text><text x="500" y="325" text-anchor="middle" font-size="22" font-weight="700" font-family="Arial,sans-serif" fill="#1f6b55">High melting point comes from strong ionic bonds between oppositely charged ions.</text>
</svg>