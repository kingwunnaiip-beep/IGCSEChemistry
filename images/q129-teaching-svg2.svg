<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-label="Why graphite is a lubricant">
    <rect width="1000" height="360" rx="22" fill="#fbfdfc"/>
    <text x="500.0" y="36" text-anchor="middle" font-size="28" font-weight="700" font-family="Arial,sans-serif" fill="#143d35">Why graphite is a lubricant</text>
    <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a7b65"/>
    </marker>
    </defs><rect x="170" y="120" width="380" height="26" rx="10" fill="#42484d"/><rect x="170" y="170" width="380" height="26" rx="10" fill="#42484d"/><rect x="170" y="220" width="380" height="26" rx="10" fill="#42484d"/><line x1="600" y1="130" x2="760" y2="130" stroke="#2a7b65" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="600" y1="180" x2="760" y2="180" stroke="#2a7b65" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="600" y1="230" x2="760" y2="230" stroke="#2a7b65" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="760" y="110" text-anchor="middle" font-size="24" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">layers slide</text><text x="760" y="145" text-anchor="middle" font-size="22" font-weight="400" font-family="Arial,sans-serif" fill="#244a40">weak forces</text><text x="760" y="175" text-anchor="middle" font-size="22" font-weight="400" font-family="Arial,sans-serif" fill="#244a40">between layers</text><text x="360" y="285" text-anchor="middle" font-size="24" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">strong covalent bonds within each layer</text><text x="500" y="325" text-anchor="middle" font-size="22" font-weight="700" font-family="Arial,sans-serif" fill="#1f6b55">Graphite lubricates because the layers move over each other easily.</text>
</svg>