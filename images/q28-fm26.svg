<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="1000" height="390" role="img"><rect x="0" y="0" width="1000" height="390" rx="16" fill="#f7faf4"/><style>.txt{font-family:Arial,Helvetica,sans-serif;fill:#1d3c33}.title{font-size:25px;font-weight:bold}.big{font-size:26px;font-weight:bold}.mid{font-size:20px}.small{font-size:17px}.box{fill:#fff;stroke:#b8cdbf;stroke-width:2}.line{stroke:#1d3c33;stroke-width:3;fill:none;stroke-linecap:round}.arrow{stroke:#156b50;stroke-width:5;fill:none;marker-end:url(#arrow)}.muted{fill:#657a71}.strong{fill:#156b50}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#156b50"/></marker><marker id="blackarrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#111"/></marker></defs><text x="40" y="48" class="txt title">Petroleum fractions and vehicle fuels</text><path d="M400 90L610 90L662 320L346 320Z" fill="#f7eee5" stroke="#8b8175" stroke-width="3"/><g font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" fill="#214336" text-anchor="middle"><text x="500" y="140">refinery gas</text><text x="500" y="196">gasoline → cars</text><text x="500" y="252">kerosene → aircraft</text><text x="500" y="303">diesel → vehicles</text></g><text x="182" y="240" text-anchor="middle" class="txt small">Hotter at base</text><text x="822" y="116" text-anchor="middle" class="txt small">Cooler at top</text></svg>