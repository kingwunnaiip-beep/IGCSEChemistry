<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-label="Forming ionic formulae">
    <rect width="1000" height="360" rx="22" fill="#fbfdfc"/>
    <text x="500.0" y="36" text-anchor="middle" font-size="28" font-weight="700" font-family="Arial,sans-serif" fill="#143d35">Forming ionic formulae</text>
    <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a7b65"/>
    </marker>
    </defs><rect x="90" y="100" width="220" height="170" rx="18" fill="#eef4ff" stroke="#bfd1ee" stroke-width="2"/><rect x="390" y="100" width="220" height="170" rx="18" fill="#eefaf1" stroke="#c3dec9" stroke-width="2"/><rect x="690" y="100" width="220" height="170" rx="18" fill="#fff4e8" stroke="#ead1af" stroke-width="2"/><text x="200" y="135" text-anchor="middle" font-size="36" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">Al³⁺</text><text x="200" y="190" text-anchor="middle" font-size="22" font-weight="400" font-family="Arial,sans-serif" fill="#244a40">needs total −3</text><text x="500" y="135" text-anchor="middle" font-size="36" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">NO₃⁻</text><text x="500" y="190" text-anchor="middle" font-size="22" font-weight="400" font-family="Arial,sans-serif" fill="#244a40">one nitrate = −1</text><text x="800" y="135" text-anchor="middle" font-size="28" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">Combine</text><text x="800" y="185" text-anchor="middle" font-size="28" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">Al³⁺ + 3NO₃⁻</text><text x="800" y="230" text-anchor="middle" font-size="30" font-weight="700" font-family="Arial,sans-serif" fill="#14624c">Al(NO₃)₃ ✓</text><text x="500" y="320" text-anchor="middle" font-size="22" font-weight="700" font-family="Arial,sans-serif" fill="#1f6b55">Use brackets when a polyatomic ion appears more than once.</text>
</svg>