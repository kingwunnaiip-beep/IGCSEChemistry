<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 352" width="960" height="352" role="img"><rect width="960" height="352" rx="17" fill="#f8fcf9"/><text x="480" y="60" text-anchor="middle" font-size="25" font-family="Arial,sans-serif" font-weight="700" fill="#183e33">Relative formula mass</text><g font-family="Arial,sans-serif"><rect x="30" y="112" width="291" height="166" rx="16" fill="#eaf6f1" stroke="#b8cdbf" stroke-width="1.8"/><text x="175.3" y="173" text-anchor="middle" font-size="29" font-weight="700" fill="#194f43">2Na</text><text x="175.3" y="212" text-anchor="middle" font-size="19" fill="#405f55">2 × 23 = 46</text><path d="M325.6666666666667 190 l7 0" stroke="#257959" stroke-width="2"/><rect x="335" y="112" width="291" height="166" rx="16" fill="#edf4ff" stroke="#b8cdbf" stroke-width="1.8"/><text x="480.0" y="173" text-anchor="middle" font-size="29" font-weight="700" fill="#194f43">3O</text><text x="480.0" y="212" text-anchor="middle" font-size="19" fill="#405f55">3 × 16 = 48</text><path d="M630.3333333333334 190 l7 0" stroke="#257959" stroke-width="2"/><rect x="639" y="112" width="291" height="166" rx="16" fill="#fff5e8" stroke="#b8cdbf" stroke-width="1.8"/><text x="784.7" y="173" text-anchor="middle" font-size="29" font-weight="700" fill="#194f43">2Z = 64</text><text x="784.7" y="212" text-anchor="middle" font-size="19" fill="#405f55">Z = 32</text><text x="480" y="326" text-anchor="middle" font-size="19" fill="#46675c">158 − 46 − 48 = 64; divide by 2</text></g></svg>