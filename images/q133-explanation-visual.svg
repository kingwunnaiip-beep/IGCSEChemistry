<text x="500" y="36" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#213f38" text-anchor="middle" >Counting atoms in methane</text><circle cx="255" cy="196" r="43" fill="#b3d9ef" stroke="#37617d" stroke-width="3"/><text x="255" y="204" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700" fill="#213f38" text-anchor="middle" >C</text><path d="M 255.0 162.01 L 255.0 124.93" fill="none" stroke="#5a707a" stroke-width="5" stroke-linecap="round"/><circle cx="255" cy="93" r="29" fill="#f6f9fb" stroke="#567580" stroke-width="3"/><text x="255" y="101" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#213f38" text-anchor="middle" >H</text><path d="M 218.7 196.0 L 179.1 196.0" fill="none" stroke="#5a707a" stroke-width="5" stroke-linecap="round"/><circle cx="145" cy="196" r="29" fill="#f6f9fb" stroke="#567580" stroke-width="3"/><text x="145" y="204" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#213f38" text-anchor="middle" >H</text><path d="M 291.63 196.0 L 331.59000000000003 196.0" fill="none" stroke="#5a707a" stroke-width="5" stroke-linecap="round"/><circle cx="366" cy="196" r="29" fill="#f6f9fb" stroke="#567580" stroke-width="3"/><text x="366" y="204" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#213f38" text-anchor="middle" >H</text><path d="M 255.0 229.0 L 255.0 265.0" fill="none" stroke="#5a707a" stroke-width="5" stroke-linecap="round"/><circle cx="255" cy="296" r="29" fill="#f6f9fb" stroke="#567580" stroke-width="3"/><text x="255" y="304" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#213f38" text-anchor="middle" >H</text><text x="510" y="145" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#213f38" text-anchor="start" >1 CH₄ molecule = 5 atoms</text><text x="510" y="208" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#213f38" text-anchor="start" >0.0100 mol × 6.02 × 10²³</text><text x="510" y="245" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#213f38" text-anchor="start" >= 6.02 × 10²¹ molecules</text><text x="510" y="300" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#176b53" text-anchor="start" >× 5 = 3.01 × 10²² atoms</text><text x="500" y="389" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#176b53" text-anchor="middle" >Molecules × atoms per molecule = total number of atoms.</text></svg>