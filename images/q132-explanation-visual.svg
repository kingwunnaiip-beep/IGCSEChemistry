<text x="500" y="36" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#213f38" text-anchor="middle" >Titration — balanced mole ratio</text><path d="M 205 92 L 205 213" fill="none" stroke="#2b5363" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="188" y="90" width="34" height="160" fill="none" stroke="#446f84" stroke-width="3"/><rect x="190" y="185" width="30" height="65" fill="#d7f0fa" stroke="#446f84" stroke-width="1"/><path d="M188 246 L222 246 M205 249 L205 302" fill="none" stroke="#456879" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M185 302 L165 335 L165 342 L253 342 L253 335 L225 302 Z" fill="#e2f1f4" stroke="#436773" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="207" y="366" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#213f38" text-anchor="middle" >25.0 cm³ NaOH</text><text x="270" y="100" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#213f38" text-anchor="start" >acid in burette</text><text x="270" y="137" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#213f38" text-anchor="start" >12.5 cm³</text><text x="270" y="169" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#213f38" text-anchor="start" >0.100 mol/dm³</text><path d="M 477 185 L 545 185" fill="none" stroke="#166b59" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="750" y="122" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#213f38" text-anchor="middle" >H₂SO₄ : NaOH = 1 : 2</text><text x="750" y="175" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#213f38" text-anchor="middle" >Acid = 0.00125 mol</text><text x="750" y="219" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#213f38" text-anchor="middle" >Base = 0.00250 mol</text><text x="750" y="268" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#213f38" text-anchor="middle" >0.00250 / 0.0250</text><text x="750" y="320" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#176b53" text-anchor="middle" >= 0.100 mol/dm³</text><text x="500" y="389" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#176b53" text-anchor="middle" >Always convert cm³ to dm³ before calculating concentration.</text></svg>