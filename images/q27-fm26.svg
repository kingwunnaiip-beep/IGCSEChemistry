<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="1000" height="390" role="img"><rect x="0" y="0" width="1000" height="390" rx="16" fill="#f7faf4"/><style>.txt{font-family:Arial,Helvetica,sans-serif;fill:#1d3c33}.title{font-size:25px;font-weight:bold}.big{font-size:26px;font-weight:bold}.mid{font-size:20px}.small{font-size:17px}.box{fill:#fff;stroke:#b8cdbf;stroke-width:2}.line{stroke:#1d3c33;stroke-width:3;fill:none;stroke-linecap:round}.arrow{stroke:#156b50;stroke-width:5;fill:none;marker-end:url(#arrow)}.muted{fill:#657a71}.strong{fill:#156b50}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#156b50"/></marker><marker id="blackarrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#111"/></marker></defs><text x="40" y="48" class="txt title">Incomplete combustion pollutants</text><rect x="56" y="133" width="280" height="110" rx="14" fill="#fbeede" stroke="#bdccc3" stroke-width="2"/><text x="196.0" y="182.0" text-anchor="middle" class="txt big">Limited O₂</text><text x="196.0" y="216.0" text-anchor="middle" class="txt small">incomplete burning</text><rect x="398" y="133" width="248" height="110" rx="14" fill="#f5e1e1" stroke="#bdccc3" stroke-width="2"/><text x="522.0" y="182.0" text-anchor="middle" class="txt big">CO gas</text><text x="522.0" y="216.0" text-anchor="middle" class="txt small">toxic pollutant</text><rect x="706" y="133" width="236" height="110" rx="14" fill="#e8edf0" stroke="#bdccc3" stroke-width="2"/><text x="824.0" y="182.0" text-anchor="middle" class="txt big">Carbon (soot)</text><text x="824.0" y="216.0" text-anchor="middle" class="txt small">solid particles</text><path d="M336 190 L393 190" fill="none" stroke="#156b50" stroke-width="5" marker-end="url(#arrow)"/><path d="M647 190 L703 190" fill="none" stroke="#156b50" stroke-width="5" marker-end="url(#arrow)"/><text x="500" y="3