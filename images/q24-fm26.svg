<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="1000" height="390" role="img"><rect x="0" y="0" width="1000" height="390" rx="16" fill="#f7faf4"/><style>.txt{font-family:Arial,Helvetica,sans-serif;fill:#1d3c33}.title{font-size:25px;font-weight:bold}.big{font-size:26px;font-weight:bold}.mid{font-size:20px}.small{font-size:17px}.box{fill:#fff;stroke:#b8cdbf;stroke-width:2}.line{stroke:#1d3c33;stroke-width:3;fill:none;stroke-linecap:round}.arrow{stroke:#156b50;stroke-width:5;fill:none;marker-end:url(#arrow)}.muted{fill:#657a71}.strong{fill:#156b50}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#156b50"/></marker><marker id="blackarrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#111"/></marker></defs><text x="40" y="48" class="txt title">Sacrificial protection by zinc</text><rect x="96" y="117" width="315" height="130" rx="14" fill="#e1f4e8" stroke="#bdccc3" stroke-width="2"/><text x="253.5" y="176.0" text-anchor="middle" class="txt big">Zinc coating</text><text x="253.5" y="210.0" text-anchor="middle" class="txt small">more reactive metal</text><rect x="594" y="117" width="315" height="130" rx="14" fill="#e8edf0" stroke="#bdccc3" stroke-width="2"/><text x="751.5" y="176.0" text-anchor="middle" class="txt big">Iron</text><text x="751.5" y="210.0" text-anchor="middle" class="txt small">less reactive metal</text><path d="M407 180 L590 180" fill="none" stroke="#156b50" stroke-width="5" marker-end="url(#arrow)"/><text x="500" y="302" text-anchor="middle" class="txt mid">If scratched, zinc corrodes in preference to iron</text></svg>