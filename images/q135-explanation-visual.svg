<text x="500" y="36" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#213f38" text-anchor="middle" >Identify an electrolyte by gases</text><path d="M 135 90 L135 292 Q135 320 165 320 L490 320 Q520 320 520 292 L520 90" fill="none" stroke="#54757e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="190" y="130" width="25" height="150" fill="#7897a5" stroke="#45545c" stroke-width="2"/><rect x="435" y="130" width="25" height="150" fill="#7897a5" stroke="#45545c" stroke-width="2"/><path d="M 145 202 L 509 202" fill="none" stroke="#9acdda" stroke-width="2" stroke-linecap="round"/><text x="203" y="110" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#213f38" text-anchor="middle" >ANODE +</text><text x="445" y="110" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#213f38" text-anchor="middle" >CATHODE −</text><text x="204" y="161" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1a7557" text-anchor="middle" >Cl₂</text><text x="448" y="161" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#286e9b" text-anchor="middle" >H₂</text><text x="710" y="135" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#213f38" text-anchor="middle" >Cl₂: bleaches moist litmus</text><text x="710" y="189" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#213f38" text-anchor="middle" >H₂: squeaky pop test</text><text x="710" y="258" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#176b53" text-anchor="middle" >Concentrated NaCl(aq)</text><text x="710" y="299" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#176b53" text-anchor="middle" >Only substance 2</text><text x="500" y="389" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#176b53" text-anchor="middle" >Concentrated chloride gives Cl₂ at anode and H₂ at cathode.</text></svg>