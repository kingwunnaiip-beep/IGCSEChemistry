<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-label="Atoms and ions">
    <rect width="1000" height="360" rx="22" fill="#fbfdfc"/>
    <text x="500.0" y="36" text-anchor="middle" font-size="28" font-weight="700" font-family="Arial,sans-serif" fill="#143d35">Atoms and ions</text>
    <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a7b65"/>
    </marker>
    </defs><rect x="70" y="90" width="280" height="210" rx="18" fill="#eef4ff" stroke="#bfd1ee" stroke-width="2"/><rect x="380" y="90" width="250" height="210" rx="18" fill="#eefaf1" stroke="#c3dec9" stroke-width="2"/><rect x="660" y="90" width="280" height="210" rx="18" fill="#fff4e8" stroke="#ead1af" stroke-width="2"/><text x="210" y="125" text-anchor="middle" font-size="24" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">Neutral atom</text><text x="210" y="175" text-anchor="middle" font-size="28" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">protons = electrons</text><text x="210" y="220" text-anchor="middle" font-size="22" font-weight="400" font-family="Arial,sans-serif" fill="#244a40">atomic number = p</text><text x="505" y="125" text-anchor="middle" font-size="26" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">Na⁺</text><text x="505" y="175" text-anchor="middle" font-size="30" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">11 p, 10 e</text><text x="505" y="220" text-anchor="middle" font-size="22" font-weight="400" font-family="Arial,sans-serif" fill="#244a40">lost one electron</text><text x="800" y="125" text-anchor="middle" font-size="24" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">Isotopes</text><text x="800" y="175" text-anchor="middle" font-size="24" font-weight="400" font-family="Arial,sans-serif" fill="#244a40">same protons</text><text x="800" y="210" text-anchor="middle" font-size="24" font-weight="400" font-family="Arial,sans-serif" fill="#244a40">different neutrons</text><text x="500" y="325" text-anchor="middle" font-size="24" font-weight="700" font-family="Arial,sans-serif" fill="#1f6b55">Only statement A is correct.</text>
</svg>