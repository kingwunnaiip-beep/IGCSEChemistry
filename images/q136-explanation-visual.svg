<text x="500" y="36" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#213f38" text-anchor="middle" >Extracting aluminium</text><path d="M 130 92 L130 305 L650 305 L650 92" fill="none" stroke="#66777e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 135 177 L645 177 L645 297 L135 297 Z" fill="#e7f1f5" stroke="#56a7ca" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="235" y="95" width="42" height="137" fill="#637d88" stroke="#444f56" stroke-width="2"/><rect x="505" y="95" width="42" height="137" fill="#637d88" stroke="#444f56" stroke-width="2"/><text x="256" y="75" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#213f38" text-anchor="middle" >Carbon anode (+)</text><text x="520" y="75" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#213f38" text-anchor="middle" >Carbon cathode (−)</text><text x="390" y="202" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#213f38" text-anchor="middle" >Al₂O₃ dissolved in cryolite</text><text x="260" y="278" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#213f38" text-anchor="middle" >2O²⁻ → O₂ + 4e⁻</text><text x="528" y="278" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#213f38" text-anchor="middle" >Al³⁺ + 3e⁻ → Al</text><text x="811" y="152" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#176b53" text-anchor="middle" >Cryolite</text><text x="811" y="198" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#213f38" text-anchor="middle" >dissolves Al₂O₃</text><text x="811" y="240" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#213f38" text-anchor="middle" >lowers operating</text><text x="811" y="268" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#213f38" text-anchor="middle" >temperature</text><text x="500" y="389" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#176b53" text-anchor="middle" >Anode: oxidation of oxide ions. Cathode: reduction of aluminium ions.</text></svg>