<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-label="Desalination">
    <rect width="1000" height="360" rx="22" fill="#fbfdfc"/>
    <text x="500.0" y="36" text-anchor="middle" font-size="28" font-weight="700" font-family="Arial,sans-serif" fill="#143d35">Desalination</text>
    <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a7b65"/>
    </marker>
    </defs><rect x="55" y="92" width="190" height="180" rx="18" fill="#eef4ff" stroke="#bfd1ee" stroke-width="2"/><rect x="300" y="92" width="190" height="180" rx="18" fill="#eefaf1" stroke="#c3dec9" stroke-width="2"/><rect x="545" y="92" width="190" height="180" rx="18" fill="#eef4ff" stroke="#bfd1ee" stroke-width="2"/><rect x="790" y="92" width="150" height="180" rx="18" fill="#fff4e8" stroke="#ead1af" stroke-width="2"/><text x="150" y="125" text-anchor="middle" font-size="24" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">Sea water</text><text x="150" y="175" text-anchor="middle" font-size="28" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">heat it</text><text x="395" y="125" text-anchor="middle" font-size="24" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">Water vapour</text><text x="395" y="175" text-anchor="middle" font-size="20" font-weight="400" font-family="Arial,sans-serif" fill="#244a40">leaves salt behind</text><text x="640" y="125" text-anchor="middle" font-size="24" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">Condense</text><text x="640" y="175" text-anchor="middle" font-size="24" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">cool vapour</text><text x="865" y="125" text-anchor="middle" font-size="24" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">Product</text><text x="865" y="175" text-anchor="middle" font-size="24" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">fresh water</text><line x1="245" y1="175" x2="297" y2="175" stroke="#2a7b65" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="490" y1="175" x2="542" y2="175" stroke="#2a7b65" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="735" y1="175" x2="787" y2="175" stroke="#2a7b65" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="500" y="320" text-anchor="middle" font-size="24" font-weight="700" font-family="Arial,sans-serif" fill="#1f6b55">Distillation = evaporation followed by condensation.</text>
</svg>