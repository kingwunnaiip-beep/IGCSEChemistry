<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-label="Structural formulae">
    <rect width="1000" height="360" rx="22" fill="#fbfdfc"/>
    <text x="500.0" y="36" text-anchor="middle" font-size="28" font-weight="700" font-family="Arial,sans-serif" fill="#143d35">Structural formulae</text>
    <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a7b65"/>
    </marker>
    </defs><rect x="70" y="85" width="260" height="210" rx="18" fill="#eefaf1" stroke="#c3dec9" stroke-width="2"/><rect x="370" y="85" width="260" height="210" rx="18" fill="#fff4e8" stroke="#ead1af" stroke-width="2"/><rect x="670" y="85" width="260" height="210" rx="18" fill="#eef4ff" stroke="#bfd1ee" stroke-width="2"/><text x="200" y="125" text-anchor="middle" font-size="26" font-weight="700" font-family="Arial,sans-serif" fill="#14624c">Correct answer</text><text x="200" y="170" text-anchor="middle" font-size="28" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">propan-1-ol</text><text x="200" y="215" text-anchor="middle" font-size="34" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">CH₃CH₂CH₂OH</text><text x="200" y="255" text-anchor="middle" font-size="22" font-weight="400" font-family="Arial,sans-serif" fill="#244a40">OH on carbon 1 ✓</text><text x="500" y="125" text-anchor="middle" font-size="26" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">Compare</text><text x="500" y="170" text-anchor="middle" font-size="26" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">propan-2-ol</text><text x="500" y="215" text-anchor="middle" font-size="30" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">CH₃CH(OH)CH₃</text><text x="500" y="255" text-anchor="middle" font-size="20" font-weight="400" font-family="Arial,sans-serif" fill="#244a40">OH on middle carbon</text><text x="800" y="125" text-anchor="middle" font-size="24" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">Propanoic acid</text><text x="800" y="175" text-anchor="middle" font-size="20" font-weight="400" font-family="Arial,sans-serif" fill="#244a40">must be</text><text x="800" y="215" text-anchor="middle" font-size="30" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">CH₃CH₂COOH</text><text x="800" y="255" text-anchor="middle" font-size="20" font-weight="400" font-family="Arial,sans-serif" fill="#244a40">Functional groups matter</text><text x="500" y="325" text-anchor="middle" font-size="24" font-weight="700" font-family="Arial,sans-serif" fill="#1f6b55">Name = carbon chain + bond/functional-group position.</text>
</svg>