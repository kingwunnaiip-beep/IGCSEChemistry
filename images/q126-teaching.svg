<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 325" role="img" aria-label="Chemistry teaching diagram"><rect width="930" height="325" rx="18" fill="#f7faf7"/><text x="465" y="48" text-anchor="middle" font-size="26" font-weight="bold" font-family="Arial,sans-serif" fill="#183f36">Atoms and ions</text><rect x="24.0" y="80" width="286.0" height="178" rx="17" fill="#e2f5eb" stroke="#d2dedb" stroke-width="1.5"/><text x="167.0" y="130" text-anchor="middle" font-size="25" font-family="Arial,sans-serif" font-weight="bold" fill="#204d41">Atom</text><text x="167.0" y="179" text-anchor="middle" font-size="16.5" font-family="Arial,sans-serif" fill="#3b5c50">protons = electrons</text><rect x="322.0" y="80" width="286.0" height="178" rx="17" fill="#e8f2fd" stroke="#d2dedb" stroke-width="1.5"/><text x="465.0" y="130" text-anchor="middle" font-size="25" font-family="Arial,sans-serif" font-weight="bold" fill="#204d41">Cation</text><text x="465.0" y="179" text-anchor="middle" font-size="16.5" font-family="Arial,sans-serif" fill="#3b5c50">lost electrons</text><rect x="620.0" y="80" width="286.0" height="178" rx="17" fill="#fff0de" stroke="#d2dedb" stroke-width="1.5"/><text x="763.0" y="130" text-anchor="middle" font-size="25" font-family="Arial,sans-serif" font-weight="bold" fill="#204d41">Isotope</text><text x="763.0" y="179" text-anchor="middle" font-size="16.5" font-family="Arial,sans-serif" fill="#3b5c50">different neutrons</text><text x="465" y="300" text-anchor="middle" font-size="18" font-family="Arial,sans-serif" fill="#267457">Na⁺ has 11 protons but 10 electrons.</text></svg>