<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="1000" height="390" role="img"><rect x="0" y="0" width="1000" height="390" rx="16" fill="#f7faf4"/><style>.txt{font-family:Arial,Helvetica,sans-serif;fill:#1d3c33}.title{font-size:25px;font-weight:bold}.big{font-size:26px;font-weight:bold}.mid{font-size:20px}.small{font-size:17px}.box{fill:#fff;stroke:#b8cdbf;stroke-width:2}.line{stroke:#1d3c33;stroke-width:3;fill:none;stroke-linecap:round}.arrow{stroke:#156b50;stroke-width:5;fill:none;marker-end:url(#arrow)}.muted{fill:#657a71}.strong{fill:#156b50}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#156b50"/></marker><marker id="blackarrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#111"/></marker></defs><text x="40" y="48" class="txt title">Structural formula of propan-1-ol</text><rect x="105" y="132" width="780" height="130" rx="14" fill="#e6f4e9" stroke="#bdccc3" stroke-width="2"/><text x="495.0" y="191.0" text-anchor="middle" class="txt big">CH₃–CH₂–CH₂–OH</text><text x="495.0" y="225.0" text-anchor="middle" class="txt small">3 carbon atoms; –OH attached to carbon 1</text><text x="500" y="316" text-anchor="middle" class="txt mid">Propan-1-ol has molecular formula C₃H₈O</text></svg>