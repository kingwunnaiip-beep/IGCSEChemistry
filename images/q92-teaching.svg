<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 350" role="img" aria-label="Chemistry explanation visual"><rect width="980" height="350" rx="20" fill="#f8fbf8"/><text x="490" y="51" font-size="28" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" fill="#1c4036">Electrolysis of dilute sulfuric acid</text><rect x="28" y="93" width="299" height="183" rx="18" fill="#e6f3ed" stroke="#ccddd3" stroke-width="2"/><text x="177.7" y="164" font-size="28" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" fill="#154d3b">Cathode</text><text x="177.7" y="215" font-size="17" font-family="Arial,sans-serif" text-anchor="middle" fill="#425f53">H⁺ gains electrons → H₂</text><rect x="340" y="93" width="299" height="183" rx="18" fill="#e7f1fb" stroke="#ccddd3" stroke-width="2"/><text x="490.0" y="164" font-size="28" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" fill="#154d3b">Anode</text><text x="490.0" y="215" font-size="17" font-family="Arial,sans-serif" text-anchor="middle" fill="#425f53">water / OH⁻ loses</text><text x="490.0" y="239" font-size="17" font-family="Arial,sans-serif" text-anchor="middle" fill="#425f53">electrons</text><rect x="653" y="93" width="299" height="183" rx="18" fill="#fff1df" stroke="#ccddd3" stroke-width="2"/><text x="802.3" y="164" font-size="28" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" fill="#154d3b">Product</text><text x="802.3" y="215" font-size="17" font-family="Arial,sans-serif" text-anchor="middle" fill="#425f53">O₂ formed at anode</text><text x="490" y="328" font-size="20" font-family="Arial,sans-serif" text-anchor="middle" fill="#1b654e">Remember: oxidation at the anode gives oxygen here.</text></svg>