<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 350" role="img" aria-label="Chemistry revision visual"><rect width="980" height="350" rx="18" fill="#fbfcfd"/><text x="490" y="48" font-size="27" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" fill="#193f5b">Reactivity and oxide layers</text><rect x="28.0" y="92" width="298.7" height="182" rx="18" fill="#eaf4fe" stroke="#cfd9e4" stroke-width="2"/><text x="177.3" y="150" font-size="26" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" fill="#1d4968">Aluminium surface</text><text x="177.3" y="190" font-size="17" font-family="Arial,sans-serif" text-anchor="middle" fill="#465d71">protective Al₂O₃ layer</text><rect x="340.7" y="92" width="298.7" height="182" rx="18" fill="#eef9f1" stroke="#cfd9e4" stroke-width="2"/><text x="490.0" y="150" font-size="26" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" fill="#1d4968">Zinc surface</text><text x="490.0" y="190" font-size="17" font-family="Arial,sans-serif" text-anchor="middle" fill="#465d71">no similarly protective</text><text x="490.0" y="213" font-size="17" font-family="Arial,sans-serif" text-anchor="middle" fill="#465d71">barrier here</text><rect x="653.3" y="92" width="298.7" height="182" rx="18" fill="#fff6e7" stroke="#cfd9e4" stroke-width="2"/><text x="802.7" y="150" font-size="26" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" fill="#1d4968">Observation</text><text x="802.7" y="190" font-size="17" font-family="Arial,sans-serif" text-anchor="middle" fill="#465d71">Zn reacts, Al appears</text><text x="802.7" y="213" font-size="17" font-family="Arial,sans-serif" text-anchor="middle" fill="#465d71">not to</text><text x="490" y="324" font-size="20" font-family="Arial,sans-serif" text-anchor="middle" fill="#275a7a">A protective oxide layer can hide the true reactivity of a metal.</text></svg>