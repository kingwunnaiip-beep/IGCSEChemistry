<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-label="Gas reaction in a sealed flask">
    <rect width="1000" height="360" rx="22" fill="#fbfdfc"/>
    <text x="500.0" y="36" text-anchor="middle" font-size="28" font-weight="700" font-family="Arial,sans-serif" fill="#143d35">Gas reaction in a sealed flask</text>
    <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a7b65"/>
    </marker>
    </defs><rect x="65" y="92" width="270" height="190" rx="18" fill="#eef4ff" stroke="#bfd1ee" stroke-width="2"/><rect x="370" y="92" width="260" height="190" rx="18" fill="#eefaf1" stroke="#c3dec9" stroke-width="2"/><rect x="665" y="92" width="270" height="190" rx="18" fill="#fff4e8" stroke="#ead1af" stroke-width="2"/><text x="200" y="125" text-anchor="middle" font-size="24" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">Before reaction</text><text x="200" y="175" text-anchor="middle" font-size="34" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">NH₃(g) + HCl(g)</text><text x="200" y="220" text-anchor="middle" font-size="20" font-weight="400" font-family="Arial,sans-serif" fill="#244a40">many gas particles</text><text x="500" y="125" text-anchor="middle" font-size="24" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">After reaction</text><text x="500" y="175" text-anchor="middle" font-size="36" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">NH₄Cl(s)</text><text x="500" y="220" text-anchor="middle" font-size="20" font-weight="400" font-family="Arial,sans-serif" fill="#244a40">gas particles decrease ✓</text><text x="800" y="125" text-anchor="middle" font-size="24" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">Exothermic</text><text x="800" y="175" text-anchor="middle" font-size="24" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">temperature rises</text><text x="800" y="220" text-anchor="middle" font-size="20" font-weight="400" font-family="Arial,sans-serif" fill="#244a40">average KE increases ✓</text><line x1="336" y1="175" x2="368" y2="175" stroke="#2a7b65" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="500" y="320" text-anchor="middle" font-size="20" font-weight="700" font-family="Arial,sans-serif" fill="#1f6b55">Activation energy is a property of the pathway; it does not increase just because the reaction is exothermic.</text>
</svg>