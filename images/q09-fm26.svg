<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 432" width="980" height="432" role="img"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7fffc"/><stop offset="1" stop-color="#e4f6f3"/></linearGradient><radialGradient id="orb" cx="25%" cy="20%"><stop stop-color="#fff"/><stop offset=".33" stop-color="#a7e4ed"/><stop offset="1" stop-color="#3386b6"/></radialGradient><radialGradient id="crimson" cx="22%" cy="20%"><stop stop-color="#ffe9e8"/><stop offset=".33" stop-color="#fa9f98"/><stop offset="1" stop-color="#bd424d"/></radialGradient><radialGradient id="amber" cx="24%" cy="20%"><stop stop-color="#fff"/><stop offset=".3" stop-color="#ffe0a5"/><stop offset="1" stop-color="#d59a3b"/></radialGradient><filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#2d786c" flood-opacity=".11"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#119e8b"/></marker></defs><rect width="980" height="432" rx="20" fill="url(#bg)"/><text x="490" y="53" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="650" fill="#163b35">LIMITING REACTANT CALCULATION</text><rect x="40" y="90" width="900" height="290" rx="18" fill="#ffffff" stroke="#cfe4df" stroke-width="2" filter="url(#shadow)"/><text x="490" y="130" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="650" fill="#163b35">Zn + 2HCl → ZnCl₂ + H₂</text><rect x="135" y="173" width="201" height="100" rx="18" fill="#fff2e0" stroke="#b2d4c8" stroke-width="2"/><text x="235" y="212" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="650" fill="#163b35">Zn</text><text x="235" y="247" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="650" fill="#186b61">0.0700 mol</text><rect x="393" y="173" width="201" height="100" rx="18" fill="#e2f9ee" stroke="#b2d4c8" stroke-width="2"/><text x="493" y="212" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="650" fill="#163b35">HCl</text><text x="493" y="247" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="650" fill="#186b61">0.1125 mol</text><rect x="664" y="173" width="201" height="100" rx="18" fill="#e5f4fb" stroke="#b2d4c8" stroke-width="2"/><text x="764" y="212" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="650" fill="#163b35">H₂</text><text x="764" y="247" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="650" fill="#186b61">0.05625 mol</text><text x="489" y="310" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="650" fill="#946343">HCl is limiting: 2 mol acid → 1 mol H₂</text><text x="489" y="352" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="850" fill="#0e806d">0.05625 × 24 = 1.35 dm³</text><text x="490" y="416" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="650" fill="#176e65">Gas volume at r.t.p. = moles × 24 dm³/mol</text></svg>