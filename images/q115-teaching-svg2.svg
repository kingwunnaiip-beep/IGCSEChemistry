<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-label="Bromine addition">
    <rect width="1000" height="360" rx="22" fill="#fbfdfc"/>
    <text x="500.0" y="36" text-anchor="middle" font-size="28" font-weight="700" font-family="Arial,sans-serif" fill="#143d35">Bromine addition</text>
    <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a7b65"/>
    </marker>
    </defs><rect x="70" y="95" width="260" height="190" rx="18" fill="#eef4ff" stroke="#bfd1ee" stroke-width="2"/><rect x="375" y="95" width="250" height="190" rx="18" fill="#eefaf1" stroke="#c3dec9" stroke-width="2"/><rect x="670" y="95" width="260" height="190" rx="18" fill="#fff4e8" stroke="#ead1af" stroke-width="2"/><text x="200" y="130" text-anchor="middle" font-size="24" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">Reactant</text><text x="200" y="180" text-anchor="middle" font-size="34" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">CH₃CH=CHCH₃</text><text x="200" y="225" text-anchor="middle" font-size="22" font-weight="400" font-family="Arial,sans-serif" fill="#244a40">but-2-ene</text><text x="500" y="180" text-anchor="middle" font-size="34" font-weight="700" font-family="Arial,sans-serif" fill="#7a4b1c">+ Br₂</text><line x1="330" y1="190" x2="372" y2="190" stroke="#2a7b65" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="627" y1="190" x2="668" y2="190" stroke="#2a7b65" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="800" y="130" text-anchor="middle" font-size="24" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">Product</text><text x="800" y="180" text-anchor="middle" font-size="30" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">CH₃CHBrCHBrCH₃</text><text x="800" y="225" text-anchor="middle" font-size="20" font-weight="400" font-family="Arial,sans-serif" fill="#244a40">2,3-dibromobutane</text><text x="500" y="320" text-anchor="middle" font-size="22" font-weight="700" font-family="Arial,sans-serif" fill="#1f6b55">Bromine adds across the double bond, so Br ends up on both C atoms of the C=C.</text>
</svg>