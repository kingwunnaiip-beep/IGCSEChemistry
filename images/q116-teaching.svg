<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 365" role="img" aria-label="Chemistry concept illustration"><rect x="0" y="0" width="1000" height="365" rx="22" fill="#f9fcfa"/><text x="500" y="48" font-size="29" font-weight="bold" fill="#153f37" text-anchor="middle" font-family="Arial,sans-serif">PET polyester</text><rect x="35" y="90" width="301" height="200" rx="16" fill="#e7f1fb" stroke="#cfdbd8"/><text x="185.3" y="144" font-size="24" font-weight="bold" text-anchor="middle" font-family="Arial,sans-serif" fill="#184b42">Polyester</text><text x="185.3" y="188" font-size="17" text-anchor="middle" font-family="Arial,sans-serif" fill="#4b625a">–C(=O)–O–</text><rect x="350" y="90" width="301" height="200" rx="16" fill="#e9f7ef" stroke="#cfdbd8"/><text x="500.0" y="144" font-size="24" font-weight="bold" text-anchor="middle" font-family="Arial,sans-serif" fill="#184b42">Polyamide</text><text x="500.0" y="188" font-size="17" text-anchor="middle" font-family="Arial,sans-serif" fill="#4b625a">–C(=O)–NH–</text><rect x="664" y="90" width="301" height="200" rx="16" fill="#fdf0e8" stroke="#cfdbd8"/><text x="814.7" y="144" font-size="24" font-weight="bold" text-anchor="middle" font-family="Arial,sans-serif" fill="#184b42">PET</text><text x="814.7" y="188" font-size="17" text-anchor="middle" font-family="Arial,sans-serif" fill="#4b625a">polyester link</text><text x="500" y="339" font-size="20" font-family="Arial,sans-serif" text-anchor="middle" fill="#205f4e">Ester = oxygen link; amide = nitrogen link.</text></svg>