<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" role="img" aria-label="Oxidation and reduction occur together">
<defs>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L9 4.5L0 9Z" fill="#166b59"/></marker>
 <marker id="bluearrow" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L9 4.5L0 9Z" fill="#316b9a"/></marker>
</defs>
<text x="500" y="36" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#213f38" text-anchor="middle" >Oxidation and reduction occur together</text><text x="235" y="110" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#213f38" text-anchor="middle" >IRON(II)</text><text x="235" y="178" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#213f38" text-anchor="middle" >Fe²⁺  →  Fe³⁺ + e⁻</text><text x="235" y="228" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#213f38" text-anchor="middle" >loses electrons</text><text x="235" y="262" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#b36448" text-anchor="middle" >OXIDATION</text><path d="M 365 183 L 603 183" fill="none" stroke="#166b59" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="762" y="110" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#213f38" text-anchor="middle" >MANGANATE(VII)</text><text x="762" y="178" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#213f38" text-anchor="middle" >MnO₄⁻  →  Mn²⁺</text><text x="762" y="228" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#213f38" text-anchor="middle" >gains electrons</text><text x="762" y="262" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#176b53" text-anchor="middle" >REDUCTION</text><text x="500" y="345" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#176b53" text-anchor="middle" >MnO₄⁻ is reduced and acts as the oxidising agent.</text></svg>