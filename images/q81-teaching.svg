<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 350" role="img" aria-label="Chemistry explanation visual"><rect width="980" height="350" rx="20" fill="#f8fbf8"/><text x="490" y="51" font-size="28" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" fill="#1c4036">Particle movement</text><rect x="28" y="93" width="299" height="183" rx="18" fill="#e6f3ed" stroke="#ccddd3" stroke-width="2"/><text x="177.7" y="164" font-size="28" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" fill="#154d3b">Ice</text><text x="177.7" y="215" font-size="17" font-family="Arial,sans-serif" text-anchor="middle" fill="#425f53">fixed positions;</text><text x="177.7" y="239" font-size="17" font-family="Arial,sans-serif" text-anchor="middle" fill="#425f53">vibrate</text><rect x="340" y="93" width="299" height="183" rx="18" fill="#e7f1fb" stroke="#ccddd3" stroke-width="2"/><text x="490.0" y="164" font-size="28" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" fill="#154d3b">Water</text><text x="490.0" y="215" font-size="17" font-family="Arial,sans-serif" text-anchor="middle" fill="#425f53">particles move past</text><text x="490.0" y="239" font-size="17" font-family="Arial,sans-serif" text-anchor="middle" fill="#425f53">each other</text><rect x="653" y="93" width="299" height="183" rx="18" fill="#fff1df" stroke="#ccddd3" stroke-width="2"/><text x="802.3" y="164" font-size="28" font-family="Arial,sans-serif" text-anchor="middle" font-weight="bold" fill="#154d3b">Steam</text><text x="802.3" y="215" font-size="17" font-family="Arial,sans-serif" text-anchor="middle" fill="#425f53">particles spread far</text><text x="802.3" y="239" font-size="17" font-family="Arial,sans-serif" text-anchor="middle" fill="#425f53">apart</text><text x="490" y="328" font-size="20" font-family="Arial,sans-serif" text-anchor="middle" fill="#1b654e">All particles are in motion.</text></svg>