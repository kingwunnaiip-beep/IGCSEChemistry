<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-label="Paper chromatography">
    <rect width="1000" height="360" rx="22" fill="#fbfdfc"/>
    <text x="500.0" y="36" text-anchor="middle" font-size="28" font-weight="700" font-family="Arial,sans-serif" fill="#143d35">Paper chromatography</text>
    <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a7b65"/>
    </marker>
    </defs><path d="M170 110 L170 270 Q170 300 200 300 L360 300 Q390 300 390 270 L390 110" fill="none" stroke="#355a70" stroke-width="4"/><rect x="250" y="80" width="55" height="180" fill="#ffffff" stroke="#8ca3b0" stroke-width="3"/><line x1="178" y1="230" x2="382" y2="230" stroke="#69a9d3" stroke-width="6"/><circle cx="278" cy="210" r="8" fill="#222"/><text x="520" y="120" text-anchor="middle" font-size="26" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">Correct setup</text><text x="520" y="165" text-anchor="start" font-size="24" font-weight="400" font-family="Arial,sans-serif" fill="#244a40">• paper dips into solvent</text><text x="520" y="205" text-anchor="start" font-size="24" font-weight="400" font-family="Arial,sans-serif" fill="#244a40">• ink spot stays above solvent</text><text x="520" y="245" text-anchor="start" font-size="24" font-weight="400" font-family="Arial,sans-serif" fill="#244a40">• solvent rises up the paper</text><line x1="306" y1="160" x2="455" y2="160" stroke="#2a7b65" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="286" y1="210" x2="455" y2="210" stroke="#2a7b65" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="230" y1="230" x2="455" y2="260" stroke="#2a7b65" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="500" y="325" text-anchor="middle" font-size="22" font-weight="700" font-family="Arial,sans-serif" fill="#1f6b55">If the spot starts below the solvent, the sample washes off instead of separating.</text>
</svg>