<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-label="Hydrocarbons and combustion">
    <rect width="1000" height="360" rx="22" fill="#fbfdfc"/>
    <text x="500.0" y="36" text-anchor="middle" font-size="28" font-weight="700" font-family="Arial,sans-serif" fill="#143d35">Hydrocarbons and combustion</text>
    <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a7b65"/>
    </marker>
    </defs><rect x="60" y="80" width="240" height="200" rx="18" fill="#eef4ff" stroke="#bfd1ee" stroke-width="2"/><rect x="380" y="80" width="240" height="200" rx="18" fill="#eefaf1" stroke="#c3dec9" stroke-width="2"/><rect x="700" y="80" width="240" height="200" rx="18" fill="#fff4e8" stroke="#ead1af" stroke-width="2"/><text x="180" y="120" text-anchor="middle" font-size="24" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">Hydrocarbon 1</text><text x="180" y="170" text-anchor="middle" font-size="36" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">C₆H₁₄</text><text x="180" y="210" text-anchor="middle" font-size="22" font-weight="400" font-family="Arial,sans-serif" fill="#244a40">6 carbon atoms</text><text x="500" y="120" text-anchor="middle" font-size="24" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">Hydrocarbon 2</text><text x="500" y="170" text-anchor="middle" font-size="36" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">C₆H₁₂</text><text x="500" y="210" text-anchor="middle" font-size="22" font-weight="400" font-family="Arial,sans-serif" fill="#244a40">6 carbon atoms</text><line x1="300" y1="170" x2="375" y2="170" stroke="#2a7b65" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="620" y1="170" x2="695" y2="170" stroke="#2a7b65" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="820" y="120" text-anchor="middle" font-size="24" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">Complete combustion</text><text x="820" y="170" text-anchor="middle" font-size="42" font-weight="700" font-family="Arial,sans-serif" fill="#7a4b1c">6CO₂</text><text x="820" y="210" text-anchor="middle" font-size="20" font-weight="400" font-family="Arial,sans-serif" fill="#244a40">per mole of either fuel</text><text x="500" y="325" text-anchor="middle" font-size="24" font-weight="700" font-family="Arial,sans-serif" fill="#1f6b55">Same number of carbon atoms  →  same amount of CO₂ formed per mole.</text>
</svg>