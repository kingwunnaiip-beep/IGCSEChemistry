<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-label="Gas volume changes">
    <rect width="1000" height="360" rx="22" fill="#fbfdfc"/>
    <text x="500.0" y="36" text-anchor="middle" font-size="28" font-weight="700" font-family="Arial,sans-serif" fill="#143d35">Gas volume changes</text>
    <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a7b65"/>
    </marker>
    </defs><rect x="90" y="92" width="350" height="210" rx="18" fill="#eef4ff" stroke="#bfd1ee" stroke-width="2"/><rect x="560" y="92" width="350" height="210" rx="18" fill="#eefaf1" stroke="#c3dec9" stroke-width="2"/><text x="265" y="125" text-anchor="middle" font-size="26" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">Reduced temperature</text><rect x="170" y="165" width="160" height="48" rx="10" fill="#fff" stroke="#6b8897" stroke-width="3"/><rect x="140" y="168" width="35" height="42" fill="#dfeef5" stroke="#6b8897" stroke-width="3"/><circle cx="210" cy="189" r="5" fill="#255c7c"/><circle cx="240" cy="189" r="5" fill="#255c7c"/><circle cx="270" cy="189" r="5" fill="#255c7c"/><circle cx="300" cy="189" r="5" fill="#255c7c"/><text x="265" y="255" text-anchor="middle" font-size="20" font-weight="400" font-family="Arial,sans-serif" fill="#244a40">smaller volume → particles closer</text><text x="735" y="125" text-anchor="middle" font-size="26" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">Reduced pressure</text><rect x="610" y="150" width="230" height="78" rx="10" fill="#fff" stroke="#5f9070" stroke-width="3"/><rect x="840" y="153" width="35" height="72" fill="#e3f2e9" stroke="#5f9070" stroke-width="3"/><circle cx="650" cy="189" r="5" fill="#1d7c4f"/><circle cx="700" cy="189" r="5" fill="#1d7c4f"/><circle cx="750" cy="189" r="5" fill="#1d7c4f"/><circle cx="800" cy="189" r="5" fill="#1d7c4f"/><text x="735" y="255" text-anchor="middle" font-size="20" font-weight="400" font-family="Arial,sans-serif" fill="#244a40">larger volume → particles further apart</text>
</svg>