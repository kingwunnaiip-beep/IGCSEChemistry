<svg xmlns="http://www.w3.org/2000/svg" width="960" height="355" viewBox="0 0 960 355" role="img" aria-label="Question 38 explanation of A blue solid, Q, is soluble in water."><rect x="0" y="0" width="960" height="355" rx="22" fill="#f7fbf7"/><rect x="14" y="14" width="932" height="327" rx="16" fill="#fff" stroke="#d8e9de" stroke-width="2"/><text x="34" y="54" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#21483b">A blue solid, Q, is soluble in water.</text><rect x="52" y="124" width="258" height="124" rx="17" fill="#e8efff" stroke="#add0bb" stroke-width="2"/><text x="181.0" y="183.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#21483b">Q(aq)</text><text x="181.0" y="216.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#49665a">dissolved solid</text><path d="M320 186 L418 186" stroke="#247459" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M418 186 l-14 -8 v16z" fill="#247459"/><rect x="423" y="124" width="211" height="124" rx="17" fill="#fff0e0" stroke="#add0bb" stroke-width="2"/><text x="528.5" y="183.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#21483b">Concentrate</text><text x="528.5" y="216.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#49665a">evaporate water</text><path d="M642 186 L736 186" stroke="#247459" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M736 186 l-14 -8 v16z" fill="#247459"/><rect x="743" y="124" width="174" height="124" rx="17" fill="#e8f4ea" stroke="#add0bb" stroke-width="2"/><text x="830.0" y="183.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#21483b">Q(s)</text><text x="830.0" y="216.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#49665a">pure crystals</text><text x="480" y="316" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#2