<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" role="img" aria-label="Contact process: temperature trade-off">
<defs>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L9 4.5L0 9Z" fill="#166b59"/></marker>
 <marker id="bluearrow" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L9 4.5L0 9Z" fill="#316b9a"/></marker>
</defs>
<text x="500" y="36" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#213f38" text-anchor="middle" >Contact process: temperature trade-off</text><text x="500" y="102" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#213f38" text-anchor="middle" >2SO₂(g) + O₂(g) ⇌ 2SO₃(g)</text><text x="165" y="190" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#213f38" text-anchor="middle" >Increase</text><text x="165" y="232" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#213f38" text-anchor="middle" >temperature</text><path d="M 270 211 L 381 211" fill="none" stroke="#166b59" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><text x="520" y="180" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#176b53" text-anchor="middle" >Rate increases</text><text x="520" y="222" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#213f38" text-anchor="middle" >(more collisions)</text><path d="M 640 211 L 740 211" fill="none" stroke="#166b59" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><text x="830" y="180" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#8a523b" text-anchor="middle" >SO₃ yield</text><text x="830" y="222" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#8a523b" text-anchor="middle" >decreases</text><text x="500" y="316" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#176b53" text-anchor="middle" >Forward reaction exothermic: higher T shifts equilibrium to reactants.</text></svg>