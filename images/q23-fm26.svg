<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="1000" height="390" role="img"><rect x="0" y="0" width="1000" height="390" rx="16" fill="#f7faf4"/><style>.txt{font-family:Arial,Helvetica,sans-serif;fill:#1d3c33}.title{font-size:25px;font-weight:bold}.big{font-size:26px;font-weight:bold}.mid{font-size:20px}.small{font-size:17px}.box{fill:#fff;stroke:#b8cdbf;stroke-width:2}.line{stroke:#1d3c33;stroke-width:3;fill:none;stroke-linecap:round}.arrow{stroke:#156b50;stroke-width:5;fill:none;marker-end:url(#arrow)}.muted{fill:#657a71}.strong{fill:#156b50}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8Z" fill="#156b50"/></marker><marker id="blackarrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#111"/></marker></defs><text x="40" y="48" class="txt title">Protective aluminium oxide film</text><rect x="120" y="150" width="760" height="106" rx="14" fill="#b4bbc2" stroke="#697783" stroke-width="3"/><rect x="120" y="129" width="760" height="24" rx="5" fill="#badfd5" stroke="#448a74" stroke-width="2"/><text x="500" y="113" text-anchor="middle" class="txt mid">Thin, adherent Al₂O₃ layer</text><path d="M500 119 L500 139" fill="none" stroke="#156b50" stroke-width="5" marker-end="url(#arrow)"/><text x="500" y="215" text-anchor="middle" class="txt big">Aluminium metal (Al)</text><text x="500" y="312" text-anchor="middle" class="txt mid">Barrier stops moisture and oxygen reaching metal underneath</text></svg>