<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-label="Magnesium sulfide">
    <rect width="1000" height="360" rx="22" fill="#fbfdfc"/>
    <text x="500.0" y="36" text-anchor="middle" font-size="28" font-weight="700" font-family="Arial,sans-serif" fill="#143d35">Magnesium sulfide</text>
    <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a7b65"/>
    </marker>
    </defs><rect x="90" y="100" width="250" height="180" rx="18" fill="#eef4ff" stroke="#bfd1ee" stroke-width="2"/><rect x="380" y="100" width="250" height="180" rx="18" fill="#eefaf1" stroke="#c3dec9" stroke-width="2"/><rect x="670" y="100" width="250" height="180" rx="18" fill="#fff4e8" stroke="#ead1af" stroke-width="2"/><text x="215" y="130" text-anchor="middle" font-size="24" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">Mg atom</text><text x="215" y="175" text-anchor="middle" font-size="28" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">loses 2e⁻</text><text x="215" y="225" text-anchor="middle" font-size="34" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">Mg²⁺</text><text x="505" y="130" text-anchor="middle" font-size="24" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">S atom</text><text x="505" y="175" text-anchor="middle" font-size="28" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">gains 2e⁻</text><text x="505" y="225" text-anchor="middle" font-size="34" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">S²⁻</text><text x="795" y="130" text-anchor="middle" font-size="24" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">Correct diagram</text><text x="795" y="175" text-anchor="middle" font-size="24" font-weight="400" font-family="Arial,sans-serif" fill="#244a40">separate ions</text><text x="795" y="210" text-anchor="middle" font-size="22" font-weight="400" font-family="Arial,sans-serif" fill="#244a40">with charges 2+ and 2−</text><line x1="340" y1="190" x2="378" y2="190" stroke="#2a7b65" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="632" y1="190" x2="668" y2="190" stroke="#2a7b65" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="500" y="325" text-anchor="middle" font-size="24" font-weight="700" font-family="Arial,sans-serif" fill="#1f6b55">Magnesium sulfide is ionic, not covalent.</text>
</svg>