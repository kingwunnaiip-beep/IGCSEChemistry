<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-label="Changes of state">
    <rect width="1000" height="360" rx="22" fill="#fbfdfc"/>
    <text x="500.0" y="36" text-anchor="middle" font-size="28" font-weight="700" font-family="Arial,sans-serif" fill="#143d35">Changes of state</text>
    <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a7b65"/>
    </marker>
    </defs><text x="220" y="170" text-anchor="middle" font-size="34" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">ice</text><text x="500" y="170" text-anchor="middle" font-size="34" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">liquid water</text><text x="810" y="170" text-anchor="middle" font-size="34" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">water vapour</text><line x1="275" y1="160" x2="405" y2="160" stroke="#2a7b65" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="340" y="135" text-anchor="middle" font-size="22" font-weight="700" font-family="Arial,sans-serif" fill="#14624c">X = melting</text><line x1="595" y1="160" x2="730" y2="160" stroke="#2a7b65" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="662" y="135" text-anchor="middle" font-size="22" font-weight="400" font-family="Arial,sans-serif" fill="#244a40">boiling</text><line x1="730" y1="195" x2="595" y2="195" stroke="#2a7b65" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="662" y="225" text-anchor="middle" font-size="22" font-weight="700" font-family="Arial,sans-serif" fill="#14624c">Y = condensing</text><text x="500" y="315" text-anchor="middle" font-size="24" font-weight="700" font-family="Arial,sans-serif" fill="#1f6b55">Read the arrow direction carefully: X is solid → liquid, while Y is gas → liquid.</text>
</svg>