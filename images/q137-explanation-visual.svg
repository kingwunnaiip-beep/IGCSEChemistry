<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" role="img" aria-label="Bond energies — ΔH">
<defs>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L9 4.5L0 9Z" fill="#166b59"/></marker>
 <marker id="bluearrow" markerWidth="9" markerHeight="9" refX="7.4" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L9 4.5L0 9Z" fill="#316b9a"/></marker>
</defs>
<text x="500" y="36" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#213f38" text-anchor="middle" >Bond energies — ΔH</text><text x="235" y="108" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#213f38" text-anchor="middle" >BONDS BROKEN</text><text x="765" y="108" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#213f38" text-anchor="middle" >BONDS FORMED</text><text x="235" y="168" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#213f38" text-anchor="middle" >H–H = +436 kJ</text><text x="235" y="215" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#213f38" text-anchor="middle" >Cl–Cl = +242 kJ</text><path d="M 106 240 L 360 240" fill="none" stroke="#677b7f" stroke-width="2" stroke-linecap="round"/><text x="235" y="290" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#213f38" text-anchor="middle" >Total +678 kJ</text><text x="765" y="168" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#213f38" text-anchor="middle" >2(H–Cl) = 2 × 431</text><text x="765" y="215" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#213f38" text-anchor="middle" >= 862 kJ released</text><path d="M 650 240 L 890 240" fill="none" stroke="#677b7f" stroke-width="2" stroke-linecap="round"/><text x="765" y="290" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#213f38" text-anchor="middle" >Total −862 kJ</text><path d="M 410 215 L 615 215" fill="none" stroke="#166b59" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="510" y="178" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#176b53" text-anchor="middle" >ΔH = 678 − 862</text><text x="510" y="250" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#176b53" text-anchor="middle" >= −184</text><text x="500" y="343" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#176b53" text-anchor="middle" >Negative ΔH → exothermic</text><text x="500" y="389" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#176b53" text-anchor="middle" >Breaking bonds absorbs energy; forming bonds releases energy.</text></svg>