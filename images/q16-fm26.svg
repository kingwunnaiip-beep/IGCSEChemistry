<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 432" role="img"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fffc"/><stop offset="1" stop-color="#e4f6f3"/></linearGradient><radialGradient id="b" cx="25%" cy="20%"><stop stop-color="#fff"/><stop offset=".4" stop-color="#b5e3f4"/><stop offset="1" stop-color="#347eab"/></radialGradient><radialGradient id="g" cx="30%" cy="20%"><stop stop-color="#fff"/><stop offset=".4" stop-color="#b3ebcc"/><stop offset="1" stop-color="#2d9985"/></radialGradient><radialGradient id="r" cx="30%" cy="20%"><stop stop-color="#fff"/><stop offset=".4" stop-color="#f2bbbb"/><stop offset="1" stop-color="#c15d5a"/></radialGradient><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#3a786f" flood-opacity=".14"/></filter><marker id="arr" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#167e72"/></marker></defs><rect width="980" height="432" rx="18" fill="url(#bg)"/><text x="490" y="46" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="650" fill="#173c36">REDOX: WHO LOSES AND GAINS ELECTRONS?</text><rect x="38" y="94" width="434" height="265" rx="18" fill="#fff" stroke="#cde3df" stroke-width="2" filter="url(#s)"/><rect x="504" y="94" width="438" height="265" rx="18" fill="#fff" stroke="#cde3df" stroke-width="2" filter="url(#s)"/><text x="251" y="145" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="850" fill="#c15d5a">OXIDATION</text><text x="722" y="145" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="850" fill="#137f70">REDUCTION</text><text x="251" y="207" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="650" fill="#173c36">Fe²⁺ → Fe³⁺ + e⁻</text><text x="722" y="207" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="650" fill="#173c36">Mn(+7) → Mn(+2)</text><text x="249" y="273" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="650" fill="#c15d5a">Loses electrons</text><text x="724" y="273" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="650" fill="#137f70">Gains electrons</text><text x="251" y="321" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="850" fill="#c15d5a">REDUCING AGENT</text><text x="723" y="321" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="850" fill="#137f70">ION REDUCED</text><text x="490" y="414" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="650" fill="#137f70">Fe²⁺ donates electrons to the manganate(VII) ion MnO₄⁻</text></svg>