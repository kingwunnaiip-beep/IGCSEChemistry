<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-label="Reaction types">
    <rect width="1000" height="360" rx="22" fill="#fbfdfc"/>
    <text x="500.0" y="36" text-anchor="middle" font-size="28" font-weight="700" font-family="Arial,sans-serif" fill="#143d35">Reaction types</text>
    <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a7b65"/>
    </marker>
    </defs><rect x="50" y="95" width="200" height="160" rx="18" fill="#eefaf1" stroke="#c3dec9" stroke-width="2"/><rect x="285" y="95" width="200" height="160" rx="18" fill="#eef4ff" stroke="#bfd1ee" stroke-width="2"/><rect x="520" y="95" width="200" height="160" rx="18" fill="#fff4e8" stroke="#ead1af" stroke-width="2"/><rect x="755" y="95" width="190" height="160" rx="18" fill="#f5efff" stroke="#d7c8f0" stroke-width="2"/><text x="150" y="130" text-anchor="middle" font-size="24" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">Substitution</text><text x="150" y="170" text-anchor="middle" font-size="20" font-weight="400" font-family="Arial,sans-serif" fill="#244a40">one atom replaced</text><text x="150" y="205" text-anchor="middle" font-size="28" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">R–H  →  R–Cl</text><text x="385" y="130" text-anchor="middle" font-size="24" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">Addition</text><text x="385" y="170" text-anchor="middle" font-size="20" font-weight="400" font-family="Arial,sans-serif" fill="#244a40">adds across C=C</text><text x="385" y="205" text-anchor="middle" font-size="28" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">C=C + Br₂</text><text x="620" y="130" text-anchor="middle" font-size="24" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">Elimination</text><text x="620" y="170" text-anchor="middle" font-size="20" font-weight="400" font-family="Arial,sans-serif" fill="#244a40">small molecule removed</text><text x="620" y="205" text-anchor="middle" font-size="22" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">alcohol → alkene</text><text x="850" y="130" text-anchor="middle" font-size="24" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">Combustion</text><text x="850" y="170" text-anchor="middle" font-size="20" font-weight="400" font-family="Arial,sans-serif" fill="#244a40">reacts with O₂</text><text x="850" y="205" text-anchor="middle" font-size="20" font-weight="700" font-family="Arial,sans-serif" fill="#244a40">fuel → CO₂ + H₂O</text><text x="500" y="315" text-anchor="middle" font-size="22" font-weight="700" font-family="Arial,sans-serif" fill="#1f6b55">Q114 asks for substitution: identify the option where one atom is replaced by another.</text>
</svg>