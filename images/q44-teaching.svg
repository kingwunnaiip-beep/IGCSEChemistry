<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img"><rect width="960" height="360" rx="16" fill="#f8fcf9"/><text x="480" y="57" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#174c3c">Catalysts and activation energy</text><g font-family="Arial,sans-serif"><rect x="30.0" y="111" width="290.7" height="163" rx="14" fill="#e9f6f1" stroke="#c4d8ce" stroke-width="1.5"/><text x="175.3" y="163" text-anchor="middle" font-size="27" font-weight="700" fill="#194839">Uncatalysed</text><text x="175.3" y="215" text-anchor="middle" font-size="18" fill="#436557">higher Eₐ</text><rect x="334.7" y="111" width="290.7" height="163" rx="14" fill="#eff5ff" stroke="#c4d8ce" stroke-width="1.5"/><text x="480.0" y="163" text-anchor="middle" font-size="27" font-weight="700" fill="#194839">Catalysed</text><text x="480.0" y="215" text-anchor="middle" font-size="18" fill="#436557">lower Eₐ</text><rect x="639.3" y="111" width="290.7" height="163" rx="14" fill="#fff5e8" stroke="#c4d8ce" stroke-width="1.5"/><text x="784.7" y="163" text-anchor="middle" font-size="27" font-weight="700" fill="#194839">ΔH</text><text x="784.7" y="215" text-anchor="middle" font-size="18" fill="#436557">unchanged</text><text x="480" y="326" font-size="18" text-anchor="middle" fill="#386552">Catalysts speed reactions without changing energy levels.</text></g></svg>