<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 325" role="img" aria-label="Chemistry teaching diagram"><rect width="930" height="325" rx="18" fill="#f7faf7"/><text x="465" y="48" text-anchor="middle" font-size="26" font-weight="bold" font-family="Arial,sans-serif" fill="#183f36">Proton number</text><rect x="24.0" y="80" width="286.0" height="178" rx="17" fill="#e2f5eb" stroke="#d2dedb" stroke-width="1.5"/><text x="167.0" y="130" text-anchor="middle" font-size="25" font-family="Arial,sans-serif" font-weight="bold" fill="#204d41">Protons</text><text x="167.0" y="179" text-anchor="middle" font-size="16.5" font-family="Arial,sans-serif" fill="#3b5c50">5</text><rect x="322.0" y="80" width="286.0" height="178" rx="17" fill="#e8f2fd" stroke="#d2dedb" stroke-width="1.5"/><text x="465.0" y="130" text-anchor="middle" font-size="25" font-family="Arial,sans-serif" font-weight="bold" fill="#204d41">Neutrons</text><text x="465.0" y="179" text-anchor="middle" font-size="16.5" font-family="Arial,sans-serif" fill="#3b5c50">6</text><rect x="620.0" y="80" width="286.0" height="178" rx="17" fill="#fff0de" stroke="#d2dedb" stroke-width="1.5"/><text x="763.0" y="130" text-anchor="middle" font-size="25" font-family="Arial,sans-serif" font-weight="bold" fill="#204d41">Element</text><text x="763.0" y="179" text-anchor="middle" font-size="16.5" font-family="Arial,sans-serif" fill="#3b5c50">boron (B)</text><text x="465" y="300" text-anchor="middle" font-size="18" font-family="Arial,sans-serif" fill="#267457">Always identify an element from protons, not neutrons.</text></svg>